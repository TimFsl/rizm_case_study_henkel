# Holthausen industrial energy screening model — assumptions (v0.1)
#
# Single source of truth for the pre-onsite screening model.
# null means the parameter is intentionally unknown (type: TBD).
# Do not replace a null with an invented plant parameter.

metadata:
  model_name: "Henkel Düsseldorf-Holthausen energy screening model"
  model_version: "v0.1"
  site_name: "Düsseldorf-Holthausen"
  description: "Transparent pre-onsite screening assumptions. Not a digital twin."

site:
  model_scope:
    value: "Full Düsseldorf-Holthausen industrial energy system"
    type: modeling_choice
    source_or_rationale: "v0.1 models site-wide energy demand before any company split."

  company_allocation:
    value: "Not modeled in v0.1"
    type: modeling_choice
    source_or_rationale: "Economic allocation of value to Henkel is handled in a later step."

  steam_pressure_levels_real:
    value: 4
    unit: count
    type: public
    confidence: medium
    source_or_rationale: "The operating site has four steam pressure levels. Kept as context; not modeled separately."

  steam_pressure_levels_modeled:
    value: 1
    unit: count
    type: modeling_choice
    source_or_rationale: "v0.1 uses one aggregated steam bus."

  annual_henkel_production_tonnes:
    value: 455000
    unit: t/a
    type: derived
    confidence: low
    source_or_rationale: "Derived figure. Only intended later as a possible EUR/t denominator. Do not use it to allocate physical energy demand."

demand:
  # Screening judgment was low/medium. Stored as medium (allowed set: high, medium, low).
  # Causal order: historical steam anchor -> steam demand -> StoREN demand
  # ratio -> electricity demand. Fuel follows from steam dispatch, then a check.
  # Electricity demand closes the residual grid balance.
  annual_steam_heat_gwh:
    value: 1040
    unit: GWh/a
    type: derived
    confidence: medium
    source_or_rationale: >
      Screening annual useful steam/heat demand anchored to historical
      Holthausen steam production of about 1.5 Mt/a. Converting steam mass
      to useful thermal energy requires pressure, temperature, and feedwater
      assumptions. An approximate 0.65-0.70 MWh_th/t screening range places
      1,040 GWh/a within the historical order of magnitude: 1.5 Mt/a times
      0.65-0.70 MWh_th/t is about 975-1,050 GWh_th/a. That enthalpy range
      is not a measured Henkel value. This is not a measured current 2026
      demand. Screening judgment was low/medium; stored as medium.

  annual_electricity_gwh:
    value: 290
    unit: GWh/a
    type: derived
    confidence: medium
    source_or_rationale: >
      Derived from the steam-demand base case using the interpolated StoREN
      useful-energy demand structure of approximately 78% steam / 22%
      electricity: 1,040 * 22/78 is about 293 GWh/a, rounded to 290 GWh/a.
      StoREN reports about 81% steam / 19% electricity for 2018 and about
      76% steam / 24% electricity in the 2030 case. The 78/22 split is the
      2026 screening interpolation of that demand structure. It describes
      site useful-energy demand, not a split of power-plant fuel output.
      This is a screening assumption, not measured current site electricity
      consumption. Screening judgment was low/medium; stored as medium.

historical_reference:
  steam_production_2012:
    value: 1850000
    unit: t/a
    type: public
    confidence: high
    source_or_rationale: >
      Historical measured operating data for the Holthausen power plant.

  electricity_generation_2012:
    value: 257.2
    unit: GWh/a
    type: public
    confidence: high
    source_or_rationale: >
      Historical measured operating data for the Holthausen power plant.

  steam_load_min_2012:
    value: 120
    unit: t/h
    type: public
    confidence: high
    source_or_rationale: >
      Approximate lower end of the observed annual steam-load range
      reported for the 2012 operating year.

  steam_load_max_2012:
    value: 380
    unit: t/h
    type: public
    confidence: high
    source_or_rationale: >
      Approximate upper end of the observed annual steam-load range
      reported for the 2012 operating year.

  electricity_generation_2016:
    value: 285
    unit: GWh/a
    type: public
    confidence: high
    source_or_rationale: >
      Reported historical annual electricity generation at the
      Düsseldorf-Holthausen power plant.

  steam_production_2016:
    value: 1500000
    unit: t/a
    type: public
    confidence: medium
    source_or_rationale: >
      Approximate historical Holthausen steam production reported for 2016,
      about 1.5 Mt/a. Physical anchor for the annual steam-demand screening
      value. Not a measured current 2026 demand, and not converted with a
      site-specific steam enthalpy.

  # External magnitude check only. Dispatch must not read this to set demand.
  fuel_input_plausibility_twh:
    value: 1.55
    unit: TWh/a
    type: derived
    confidence: low
    source_or_rationale: >
      Approximately 1.55 TWh/a is retained only as an independent site-level
      magnitude check derived from historical fuel use and later efficiency
      trends. It is not used to derive current steam or electricity demand.
      The baseline calculates fuel requirement from steam demand and the
      modeled CHP/boiler dispatch, using the CHP power-to-heat ratio and
      asset efficiencies. Electricity demand determines the residual grid
      import/export balance. That calculated fuel use, about 1.50 TWh/a
      in the current baseline, is
      compared with a screening range of about 1.4-1.7 TWh/a around this
      reference.

  total_energy_utilization_2016:
    value: 0.83
    unit: fraction
    type: public
    confidence: medium
    source_or_rationale: >
      Reported combined utilization of fuel for useful electricity
      and heat in 2016.

storen_reference:
  reference_year:
    value: 2018
    unit: year
    type: public
    confidence: high
    source_or_rationale: >
      StoREN uses 2018 as the reference year for site energy demand.

  steam_energy_share_2018:
    value: 0.81
    unit: fraction
    type: public
    confidence: medium
    source_or_rationale: >
      Approximate useful-energy demand share attributed to steam
      in the StoREN 2018 reference year.

  electricity_energy_share_2018:
    value: 0.19
    unit: fraction
    type: public
    confidence: medium
    source_or_rationale: >
      Approximate useful-energy demand share attributed to electricity
      in the StoREN 2018 reference year.

  steam_peak_2030_mw:
    value: 168.4
    unit: MW_th
    type: public
    confidence: medium
    source_or_rationale: >
      StoREN modeled maximum steam demand for 2030.
      This is not a measured current peak.

  electricity_peak_2030_mw:
    value: 47.3
    unit: MW_el
    type: public
    confidence: medium
    source_or_rationale: >
      StoREN modeled maximum electricity demand for 2030.
      This is not a measured current peak.

grid:
  import_capacity_mw:
    value: 64
    unit: MW
    type: public
    confidence: medium
    source_or_rationale: "Existing grid connection used in StoREN scenarios."

  export_capacity_mw:
    value: 10.0
    unit: MW_el
    type: assumed
    confidence: low
    critical: true
    sensitivity: [5, 10, 20]
    source_or_rationale: >
      Public sources confirm that surplus electricity from the Holthausen site
      can be exported to the public grid, but no contracted export capacity was
      found. The power plant is publicly described primarily as an onsite supply
      asset, and the 2016 CHP expansion was intended to reduce external
      electricity purchases. Historical electricity generation of approximately
      285 GWh/a is also close to the modeled annual site electricity demand of
      approximately 290 GWh/a, suggesting a system broadly balanced around
      self-consumption rather than large-scale merchant export.
      A 10 MW export limit is therefore used as a screening assumption.
      This is not a verified Henkel value. Sensitivities are 5 MW and 20 MW.
      An unconstrained run omits the limit and is not inferred from the 64 MW
      import connection.

# Public 2025 Düsseldorf high-voltage tariff, used only as a screening proxy.
# The optimizer does not choose between these regimes.
# Source name: Netzgesellschaft Düsseldorf – Preisblatt Netznutzungsentgelte Strom 2025.
# No URL is stored. Reserve-capacity products for on-site generation are not modeled.
grid_tariffs:
  voltage_level:
    value: high_voltage
    type: assumed
    confidence: low
    source_or_rationale: >
      High voltage is used as a screening assumption given the approximately
      64 MW site grid-connection reference. Screening judgment was low/medium;
      stored as low. The actual Henkel connection and billing level must be
      verified onsite. This is not a verified Henkel voltage level.

  hv_high_utilization:
    utilization_threshold_hours:
      value: 2500
      unit: h/a
    network_energy_charge_eur_per_mwh:
      value: 7.90
      unit: EUR/MWh
    network_demand_charge_eur_per_kw_a:
      value: 123.93
      unit: EUR/kW/a
    type: public_proxy
    source_or_rationale: >
      2025 published Netzgesellschaft Düsseldorf high-voltage tariff for
      metered customers with at least 2,500 utilization hours.
      Source: Netzgesellschaft Düsseldorf – Preisblatt Netznutzungsentgelte
      Strom 2025. Used as a public screening proxy, not a verified Henkel tariff.

  hv_low_utilization:
    utilization_threshold_hours:
      value: 2500
      unit: h/a
    network_energy_charge_eur_per_mwh:
      value: 49.70
      unit: EUR/MWh
    network_demand_charge_eur_per_kw_a:
      value: 19.30
      unit: EUR/kW/a
    type: public_proxy
    source_or_rationale: >
      2025 published Netzgesellschaft Düsseldorf high-voltage tariff for
      metered customers below 2,500 utilization hours.
      Source: Netzgesellschaft Düsseldorf – Preisblatt Netznutzungsentgelte
      Strom 2025. Used as a public screening proxy, not a verified Henkel tariff.

fuel_mix:
  note: >
    Screening assumption derived from a reported late-2023 operating mix.
    The interpretation used here is approximately 80% gaseous fuels and
    20% coal, with biomethane/biogas representing approximately 40% of the
    gaseous-fuel share, corresponding to about 32% of total fuel input.
    Following the 2024 coal phase-out, v0.1 assumes the former coal share
    was replaced by fossil natural gas while the absolute biomethane share
    remained approximately unchanged. This is NOT a verified current
    Henkel fuel mix. Henkel has stated an intention to increase renewable
    fuel use, so the actual current biomethane share may be higher.
    The same aggregate mix is applied to both the CHP block and the boiler.
    No additional fuel-mix sensitivity is defined in this step.

  coal_share:
    value: 0.0
    unit: fraction
    type: public
    confidence: high
    source_or_rationale: "Coal use phased out in 2024. The former coal share is treated as replaced by fossil natural gas in this screening mix."

  fossil_gas_share:
    value: 0.68
    unit: fraction
    type: assumed
    confidence: low
    source_or_rationale: "Screening share after assigning the former coal fraction to fossil natural gas. Not a verified current Henkel fuel mix."

  biomethane_share:
    value: 0.32
    unit: fraction
    type: assumed
    confidence: low
    source_or_rationale: "About 40% of the gaseous-fuel share in the late-2023 interpretation, held constant after the coal phase-out. The actual current share may be higher."

chp:
  total_utilization_efficiency:
    value: 0.86
    unit: fraction
    type: assumed
    confidence: low
    sensitivity: [0.82, 0.86, 0.90]
    source_or_rationale: "Screening assumption. Historical reported total energy utilization was about 83% in 2016."

  power_to_heat_ratio:
    value: 0.50
    unit: MWh_el/MWh_th
    type: assumed
    confidence: low
    sensitivity: [0.30, 0.50, 0.70]
    critical: true
    source_or_rationale: >
      Technology-based screening prior for the aggregated CHP block.
      This is not a Henkel-specific measured parameter.
      The value is sensitivity-tested and will later be checked against
      historical Holthausen electricity-generation magnitudes.

  max_heat_output_mw:
    value: 110
    unit: MW_th
    type: assumed
    confidence: low
    critical: true
    source_or_rationale: >
      Screening assumption for the balanced plant configuration.
      Together with 100 MW_th of modeled boiler capacity, total modeled
      steam-generation capacity is 210 MW_th, close to the order of
      magnitude reported in StoREN.
      This is not a verified current Henkel nameplate capacity.

  baseline_steam_share:
    value: 0.52
    unit: fraction
    type: derived
    confidence: low
    source_or_rationale: >
      Screening calibration parameter for the later rule-based baseline.
      With annual steam/heat demand of 1,040 GWh and a CHP
      power-to-heat ratio of 0.50, a 52% CHP share corresponds to
      approximately 270 GWh/a of CHP electricity generation.
      This is consistent with the historical Holthausen electricity-
      generation order of magnitude of roughly 257-285 GWh/a.
      It is not a measured current CHP steam share.

  chp_ramp_fraction_of_heat_capacity_per_hour:
    value: 0.50
    unit: fraction of max CHP heat output per hour
    type: assumed
    confidence: low
    sensitivity: [0.25, 0.50, 1.00]
    source_or_rationale: >
      Unit-level current Henkel ramp constraints are not public. A base
      screening assumption of 50% of aggregated CHP heat capacity per hour is
      used. This is broadly consistent with a conservative generic CCGT ramp
      assumption around 0.8% of nameplate capacity per minute (~48%/h), while
      the real Holthausen system contains multiple aggregated CHP units and may
      be more or less flexible. Sensitivity cases of 25%, 50%, and 100%/h are
      therefore reported. This is not a measured Henkel parameter.

  min_load_fraction:
    value: 0.0
    unit: fraction
    type: modeling_choice
    confidence: low
    source_or_rationale: "Simplified away in v0.1. Later a sensitivity or technical constraint."

  ramp_rate_constraint:
    value: false
    type: modeling_choice
    source_or_rationale: >
      The stored energy-only and unconstrained tariff runs do not enforce a ramp.
      The final base-profile sensitivity uses
      chp_ramp_fraction_of_heat_capacity_per_hour. No boiler ramp is applied.

  startup_costs_enabled:
    value: false
    type: modeling_choice
    source_or_rationale: "Excluded from v0.1."

boiler:
  thermal_efficiency:
    value: 0.90
    unit: fraction
    type: assumed
    confidence: low
    sensitivity: [0.85, 0.90, 0.95]
    source_or_rationale: "Screening assumption for the aggregated fuel-fired boiler. Site-specific efficiency is not set."

  max_heat_output_mw:
    value: 100
    unit: MW_th
    type: assumed
    confidence: low
    critical: true
    source_or_rationale: >
      Screening assumption for the aggregated fuel-fired boiler block.
      The value is comparable in scale to StoREN's approximately
      100 MW_th emergency heat requirement and the approximately
      92 MW_th future fuel-boiler concept.
      It is not a verified capacity of the existing Henkel boiler fleet.

plant_structure_scenarios:
  boiler_heavy:
    chp_max_heat_mw: 80
    boiler_max_heat_mw: 140
    total_heat_capacity_mw: 220
    description: >
      Sensitivity case with relatively more steam-only boiler capacity
      and less CHP heat capacity.

  balanced:
    chp_max_heat_mw: 110
    boiler_max_heat_mw: 100
    total_heat_capacity_mw: 210
    description: >
      Base screening configuration used in the main assumptions.

  chp_heavy:
    chp_max_heat_mw: 140
    boiler_max_heat_mw: 80
    total_heat_capacity_mw: 220
    description: >
      Sensitivity case with relatively more CHP heat capacity
      and less steam-only boiler capacity.

market:
  representative_market_year:
    value: 2025
    unit: year
    type: modeling_choice
    source_or_rationale: >
      2025 is used as a complete representative market year for the
      2026 physical screening model. The 2025 hourly price sequence is
      mapped in time order onto the 2026 model hours. Those timestamps
      are not actual 2026 prices.

  electricity_import_price_method:
    value: "day_ahead_plus_import_adder"
    type: modeling_choice
    source_or_rationale: "Commodity import price is the day-ahead price plus an explicit screening adder. The adder stays at zero in the tariff runs. The Düsseldorf network energy charge and demand charge are applied separately and are not folded into this adder."

  electricity_export_price_method:
    value: "day_ahead_minus_export_discount"
    type: modeling_choice
    source_or_rationale: "Export price is the day-ahead price minus a screening marketing, balancing, and transaction discount. That discount is not a network charge."

  electricity_import_adder_eur_per_mwh:
    value: 0.0
    unit: EUR/MWh
    type: assumed
    confidence: low
    sensitivity: [0, 20, 40]
    source_or_rationale: >
      Kept at zero for the network-tariff runs. The explicit Düsseldorf
      high-voltage energy charge and annual demand charge replace a generic
      network-cost adder. Adding this adder on top of that tariff would
      double-count network cost. The stored sensitivities are not run here.

  electricity_export_discount_eur_per_mwh:
    value: 5.0
    unit: EUR/MWh
    type: assumed
    confidence: low
    sensitivity: [0, 5, 10]
    source_or_rationale: >
      Screening marketing, balancing, and transaction discount.
      Export price is the day-ahead price minus 5 EUR/MWh.
      This discount is not a network charge. The 0 and 10 EUR/MWh
      sensitivities are stored and not run in this step.

  natural_gas_commodity_eur_per_mwh:
    value: 36.0
    unit: EUR/MWh_fuel
    type: assumed
    confidence: medium
    source_or_rationale: >
      Representative 2025 European wholesale gas-price proxy.
      This is not Henkel's contract price and is held constant because
      short-term gas-price variation is not the primary driver of this
      dispatch screening case.

  gas_variable_adder_eur_per_mwh:
    value: 4.0
    unit: EUR/MWh_fuel
    type: assumed
    confidence: low
    sensitivity: [0, 4, 8]
    source_or_rationale: >
      Simplified screening allowance for variable gas infrastructure /
      delivery-related costs. Not a verified Henkel tariff.
      Detailed gas capacity charges and fixed fees are not modeled.

  biomethane_premium_eur_per_mwh:
    value: 15.0
    unit: EUR/MWh_fuel
    type: assumed
    confidence: low
    sensitivity: [10, 15, 30]
    source_or_rationale: >
      Screening premium for qualifying biomethane above the underlying
      gas commodity value. Actual Henkel biomethane contract terms and
      certification quality are unknown.

  fossil_gas_price_method:
    value: "commodity_plus_variable_adder_plus_eua"
    type: modeling_choice
    source_or_rationale: "Fossil-gas variable cost is the fixed commodity proxy plus the variable adder plus the EUA cost. It is not an hourly gas series."

  biomethane_price_method:
    value: "commodity_plus_variable_adder_plus_premium"
    type: modeling_choice
    source_or_rationale: "Biomethane variable cost is the gas commodity proxy plus the variable adder plus the screening premium. EUA is not added to biomethane in the base case."

emissions:
  carbon_price_eur_per_tco2:
    value: 73.86
    unit: EUR/tCO2
    type: public
    confidence: high
    source_or_rationale: >
      Average German EUA auction price in 2025. Held fixed for all hours
      in v0.1. No hourly carbon-price series is built.

  fossil_gas_emission_factor_tco2_per_mwh_fuel:
    value: 0.2016
    unit: tCO2/MWh_fuel
    type: public
    confidence: high
    source_or_rationale: >
      Derived from the German standard natural-gas emission factor of
      0.056 tCO2/GJ on a lower-heating-value basis:
      0.056 * 3.6 = 0.2016 tCO2/MWh_fuel.
      Model fuel energy is interpreted on an LHV basis.

  biomethane_emission_factor_tco2_per_mwh_fuel:
    value: 0.0
    unit: tCO2/MWh_fuel
    type: assumed
    confidence: low
    source_or_rationale: >
      EU ETS combustion factor for qualifying sustainable biomethane in
      the base screening case. This is conditional on applicable
      sustainability and certification requirements. It is not a claim
      that lifecycle emissions are zero.

model:
  time_resolution:
    value: "1h"
    unit: h
    type: modeling_choice
    source_or_rationale: "Hourly screening resolution for v0.1."

  hours_per_year:
    value: 8760
    unit: h/a
    type: modeling_choice
    source_or_rationale: "Non-leap year. The current implementation requires 8760."

  model_year:
    value: 2026
    unit: year
    type: modeling_choice
    source_or_rationale: >
      Non-leap screening year aligned with the 2026 working baseline.

  timezone:
    value: "Europe/Berlin"
    type: modeling_choice
    source_or_rationale: >
      Local site timezone. Hourly timestamps are timezone-aware so later
      German day-ahead market data can be aligned consistently.

  steam_demand_profile:
    value: "synthetic"
    type: modeling_choice
    source_or_rationale: "No public hourly steam profile is available. Synthetic flat, base, and variable shapes are normalized to the annual total."

  electricity_demand_profile:
    value: "synthetic"
    type: modeling_choice
    source_or_rationale: "No public hourly electricity profile is available. Synthetic flat, base, and variable shapes are normalized to the annual total."

  demand_profile_method:
    value: "hour_weekday_month_factors_normalized_to_annual_energy"
    type: modeling_choice
    source_or_rationale: >
      Unnormalized shape is the hour factor times the weekday factor times
      the month factor. The shape is then scaled so the year matches the
      annual energy assumption. Factors live in demand_profile_scenarios.

  district_heating_enabled:
    value: false
    type: modeling_choice
    source_or_rationale: "Excluded from v0.1 because public heat volumes and commercial terms are unknown."

  steam_storage_enabled:
    value: false
    type: modeling_choice
    source_or_rationale: "Excluded from v0.1."

  third_party_split_enabled:
    value: false
    type: modeling_choice
    source_or_rationale: "Henkel, BASF, and other site consumers stay aggregated in v0.1."

