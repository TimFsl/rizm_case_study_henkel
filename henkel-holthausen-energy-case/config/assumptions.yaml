economics:
  value_scope:
    value: "site_energy_system"
    type: modeling_choice
    source_or_rationale: "Results describe the full industrial-site energy system. Read annual Henkel production from site.annual_henkel_production_tonnes."

  henkel_value_allocation_factor:
    value: null
    unit: fraction
    type: TBD
    source_or_rationale: "Do not infer this directly from the approximate third-party primary-energy share."
