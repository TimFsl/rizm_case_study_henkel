economics:
  value_scope:
    value: "site_energy_system"
    type: modeling_choice
    source_or_rationale: "Results describe the full industrial-site energy system. Read annual Henkel production from site.annual_henkel_production_tonnes."

  henkel_value_allocation_factor:
    value: null
    unit: fraction
    type: TBD
    source_or_rationale: "Do not infer this directly from the approximate third-party primary-energy share."

# Business Case 2. These parameters do not change the Business Case 1 dispatch.
electric_boiler:
  electrical_to_heat_efficiency:
    value: 0.99
    unit: fraction
    type: assumed
    confidence: high
    source_ids: [EB01, EB02]
    source_or_rationale: >
      Industrial electrode boilers are reported with electrical-to-heat
      efficiency from about 95% up to 99.9%. 99% is a conservative central
      screening value inside that range. Screening judgment was medium/high;
      stored as high. This is not a measured Holthausen efficiency.

  screened_capacities_mwth:
    value: [0, 5, 10, 15, 20, 25, 30, 35, 40]
    unit: MW_th
    type: modeling_choice
    source_or_rationale: >
      Discrete useful-steam capacities. 0 MW is the optimized existing system.
      Capacity is not a continuous investment variable inside the hourly model.

  capex_eur_per_mwth:
    value: 200000
    unit: EUR/MW_th
    type: assumed
    confidence: low
    sensitivity: [115000, 200000, 390000]
    source_ids: [EB02, EB03]
    source_or_rationale: >
      200,000 EUR/MW_th is a chosen screening value between published
      benchmarks. It is not itself a published central value and it is not a
      Henkel vendor quote. 115,000 EUR/MW_th is the low generic literature
      benchmark from the PBL/TNO SDE++ concept advice for a large electric
      boiler, including onsite electrical infrastructure and a steam
      connection where sufficient grid capacity already exists. 390,000
      EUR/MW_th is a high integrated-project comparator in the neighborhood of
      a German chemical-site electrode-boiler project, not a line-item quote.
      The installed cost is understood to include normal onsite integration:
      internal electrical connection, a transformer and switchgear allowance,
      piping, controls, engineering, and installation. Major external grid
      reinforcement is excluded.

  fixed_om_fraction_of_capex:
    value: 0.017
    unit: fraction/a
    type: assumed
    confidence: low
    source_ids: [EB02, EB04]
    source_or_rationale: >
      Fixed O&M is 1.7% of installed CAPEX per year. PBL/TNO also publishes a
      fixed O&M allowance that includes network cost. That allowance is not
      used, because this model already prices the Düsseldorf network tariff
      separately. Variable e-boiler O&M is zero; electricity is the operating
      cost. Existing CHP and gas-boiler fixed O&M is not reduced.

  variable_om_eur_per_mwh:
    value: 0.0
    unit: EUR/MWh_th
    type: modeling_choice
    source_or_rationale: >
      No separate variable e-boiler O&M. Electricity, fuel, carbon, and the
      network tariff already carry the operating cost.

  external_grid_expansion:
    value: false
    type: modeling_choice
    source_or_rationale: >
      The e-boiler must fit behind the existing 64 MW import connection.
      External grid reinforcement would be a separate investment case.

  steam_header_integration:
    value: "single aggregated steam bus"
    type: modeling_choice
    source_or_rationale: >
      The model assumes the e-boiler can be connected to a suitable steam
      header. Actual pressure-level integration is a key onsite engineering
      validation because Holthausen operates multiple steam pressure levels.

  market_price_years:
    value: [2023, 2024, 2025]
    unit: year
    type: modeling_choice
    source_ids: [MKT01]
    source_or_rationale: >
      Three observed DE/LU day-ahead years are an equally weighted empirical
      ensemble. They are not averaged hour by hour and they are not a forecast.

  first_operating_year:
    value: 2026
    unit: year
    type: modeling_choice
    source_or_rationale: "Screening commissioning year. CAPEX is at t = 0, before this year."

  lifetime_years:
    value: 15
    unit: a
    type: assumed
    confidence: low
    sensitivity: [10, 15, 20]
    source_ids: [EB04]
    source_or_rationale: >
      15 years is the central screening life. 10 and 20 years are sensitivities.
      No salvage value is taken at the end of life.

  real_discount_rate:
    value: 0.10
    unit: fraction
    type: assumed
    confidence: low
    sensitivity: [0.08, 0.10, 0.12]
    source_ids: [FIN01]
    source_or_rationale: >
      10% real is a screening investment hurdle, not Henkel's verified WACC.
      It sits in the 10-12% heavy-industry private discount-rate range used in
      PRIMES-style EU reference modelling. Screening judgment was low/medium;
      stored as low. No general inflation is applied.

  electricity_price_multiplier:
    value: 1.0
    unit: fraction
    type: modeling_choice
    sensitivity: [0.8, 1.0, 1.2]
    source_or_rationale: >
      One-way scaler on the historical day-ahead shapes, used only at the
      selected size. Hourly prices are not trended with the EUA path.

  fossil_pre_carbon_eur_per_mwh:
    value: 40
    unit: EUR/MWh_fuel
    type: derived
    confidence: medium
    sensitivity: [30, 40, 50]
    source_or_rationale: >
      Primary real pre-carbon fossil-gas cost, equal to the configured gas
      commodity plus the gas variable adder. It is held constant. Carbon is
      added separately through the EUA path. The sensitivities replace that
      pre-carbon stack and are not a price forecast.

  biomethane_eur_per_mwh:
    value: 55
    unit: EUR/MWh_fuel
    type: derived
    confidence: low
    sensitivity: [55, 75, 100]
    source_ids: [BIO01]
    source_or_rationale: >
      Primary biomethane price equals the configured commodity plus adder plus
      premium, held constant in real terms. It is not linked to fossil-gas
      growth. 75 and 100 EUR/MWh are one-way sensitivities, not forecasts.
      The fuel mix is unchanged. Henkel decarbonization targets are strategic
      context and are not converted into a Holthausen fuel-share path.

  primary_carbon_path:
    value: base
    type: modeling_choice
    source_or_rationale: >
      NPV and size use the base EUA path. Low and high paths are sensitivities.
      None of the paths is a forecast.

  # Screening scenarios, not forecasts. Annual values are linear between anchors.
  # Years after the last anchor hold that anchor. Not a value-parameter.
  carbon_price_paths:
    base:
      2026: 80
      2030: 110
      2040: 150
    low:
      2026: 80
      2030: 80
      2040: 80
    high:
      2026: 80
      2030: 140
      2040: 300

  # Screening scenarios, not forecasts. Not a value-parameter.
  # The anchors are rounded assumptions informed by GAS01, CO201, and CO202.
  # They are not copied forecasts. All three paths share the 2026 start.
  # Biomethane in this screen is pre-carbon gas plus the existing premium.
  # EUA is not applied to qualifying biomethane combustion.
  forward_fossil_cost_paths:
    source_ids: [GAS01, CO201, CO202]
    low:
      2026: {precarbon_gas_eur_mwh: 40, eua_eur_t: 80}
      2030: {precarbon_gas_eur_mwh: 30, eua_eur_t: 80}
      2040: {precarbon_gas_eur_mwh: 30, eua_eur_t: 80}
    mid:
      2026: {precarbon_gas_eur_mwh: 40, eua_eur_t: 80}
      2030: {precarbon_gas_eur_mwh: 40, eua_eur_t: 110}
      2040: {precarbon_gas_eur_mwh: 40, eua_eur_t: 150}
    high:
      2026: {precarbon_gas_eur_mwh: 40, eua_eur_t: 80}
      2030: {precarbon_gas_eur_mwh: 50, eua_eur_t: 140}
      2040: {precarbon_gas_eur_mwh: 50, eua_eur_t: 300}

